name: CI

on:
  pull_request:
    # ADR-012: `edited` is required (not a default type) so that adding the
    # TRUST-CORE REVIEWED line to a PR description re-runs the
    # trust-core-attestation check without needing an empty commit.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Install, typecheck, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Phase B Step 1: `npm run typecheck` includes apps/web — a real
      # `vite build` (client + SSR bundles) followed by `tsc --noEmit`, not
      # just a syntax check. See apps/web/package.json's own "typecheck".
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # docs/TRACKING.md rule 9: apps/web's initial JS bundle stays under
      # 150KB gzipped. Runs after typecheck (which already did a real
      # `vite build`), reads its .vercel/output/static/assets directly.
      - run: npm run check-bundle-size --workspace @byok/web

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # docs/DECISIONS.md's audit-allowlist ADR: fails on any high/critical
      # finding not covered by a reasoned, non-expired entry in
      # .github/audit-allowlist.json — moderate findings never fail this
      # gate, same floor as before.
      - name: npm audit (high and critical, allowlist-aware)
        run: node .github/scripts/check-audit-allowlist.mjs

      # ADR-006: trust-core dependencies are pinned to exact versions on
      # purpose. This doesn't block the merge on its own — the
      # trust-core-attestation job below is the actual gate for changes
      # under a trust-core path (ADR-012) — it just makes the change
      # visible on the PR so whoever writes the attestation line knows to
      # check the pin is still exact and the bump was intentional.
      - name: Flag trust-core package.json / lockfile changes (ADR-006)
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE_REF" HEAD -- \
            apps/router/package.json \
            packages/vault/package.json \
            packages/cost-gate/package.json \
            packages/approval-queue/package.json \
            packages/db/package.json \
            package-lock.json || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning::Trust-core dependency files changed — verify pins are still exact per ADR-006:"
            echo "$CHANGED"
          fi

  integration-tests:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: byok
          POSTGRES_PASSWORD: byok_ci_password
          POSTGRES_DB: byok
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U byok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://byok:byok_ci_password@localhost:5432/byok
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs as the POSTGRES_USER role (byok) — the official Postgres
      # image always creates that role as a SUPERUSER, which is exactly
      # the elevated privilege DDL like CREATE POLICY / ALTER TABLE ...
      # FORCE ROW LEVEL SECURITY needs to run.
      - run: npm run db:migrate
      # Issue #38 found this the hard way: FORCE ROW LEVEL SECURITY has
      # NO effect on a superuser (or any BYPASSRLS role) — Postgres skips
      # the row-security system for them entirely, unconditionally. Every
      # *.itest.ts step below had been connecting AS that same superuser
      # (byok), so no itest querying for a specific, known-existing row
      # could ever have proven RLS was actually enforced — only that the
      # SQL itself was well-formed. A restricted, ordinary role is what
      # actually exercises the policies the app's real runtime role must
      # obey (see docs/architecture/security-architecture.md's own note
      # that the deployed connection role must never be SUPERUSER/BYPASSRLS).
      - name: Create a restricted app_user role — RLS only means something against a non-superuser connection
        env:
          DATABASE_URL: postgres://byok:byok_ci_password@localhost:5432/byok
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN
              CREATE ROLE app_user LOGIN PASSWORD 'app_user_ci_password' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          GRANT CONNECT ON DATABASE byok TO app_user;
          GRANT USAGE ON SCHEMA public TO app_user;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;
          SQL
      # THE atomicity fix (issue #6): proves the reservation/autonomy race
      # is closed against a REAL Postgres, not just an in-memory fake — see
      # each package's *.itest.ts for what's actually being proven. Every
      # test:integration step from here down runs as app_user, not byok —
      # DATABASE_URL is overridden per-step, migrations above already ran
      # as the owning role and don't need to run again.
      - run: npm run test:integration --workspace @byok/cost-gate
        env:
          DATABASE_URL: postgres://app_user:app_user_ci_password@localhost:5432/byok
      - run: npm run test:integration --workspace @byok/approval-queue
        env:
          DATABASE_URL: postgres://app_user:app_user_ci_password@localhost:5432/byok
      - run: npm run test:integration --workspace @byok/router
        env:
          DATABASE_URL: postgres://app_user:app_user_ci_password@localhost:5432/byok
      # Issue #38: proves the org-chart -> tenant handoff's RLS boundary
      # against a REAL Postgres — a claimed chart closing to its original
      # user and staying invisible to every other tenant, not just an
      # application-code assumption.
      - run: npm run test:integration --workspace @byok/db
        env:
          DATABASE_URL: postgres://app_user:app_user_ci_password@localhost:5432/byok
      # Vault durability: proves the Brain/Hands key + DEK storage swap
      # (in-memory Maps -> Postgres) preserves RLS tenant isolation
      # against a REAL Postgres, not just an in-memory fake.
      - run: npm run test:integration --workspace @byok/vault
        env:
          DATABASE_URL: postgres://app_user:app_user_ci_password@localhost:5432/byok

  trust-core-attestation:
    name: Trust-core attestation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ADR-012: branch protection no longer requires an approving review
      # (unsatisfiable with a single-account repo — GitHub won't let an
      # author approve their own PR). This is the replacement gate for
      # trust-core paths specifically: a required CI check, not an
      # approval, so it works the same for one maintainer or many. Paths
      # here mirror .github/CODEOWNERS' trust-core entries exactly — keep
      # the two in sync if either changes.
      - name: Require an explicit trust-core review attestation
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- \
            apps/router/ \
            packages/agents/ \
            packages/vault/ \
            packages/cost-gate/ \
            packages/approval-queue/ \
            packages/db/ \
            docs/architecture/security-architecture.md \
            eslint.config.js \
            .github/ || true)

          if [ -z "$CHANGED" ]; then
            echo "No trust-core paths changed — no attestation required."
            exit 0
          fi

          echo "Trust-core paths changed by this PR:"
          echo "$CHANGED"

          if echo "$PR_BODY" | grep -qF "TRUST-CORE REVIEWED: veltrixnextgen-arch"; then
            echo "Attestation found in PR description."
            exit 0
          fi

          echo "::error::This PR touches a trust-core path but its description does not contain the line 'TRUST-CORE REVIEWED: veltrixnextgen-arch'. Add that line only after actually reading the trust-core diff — this check exists so that line means something."
          exit 1
