name: Deploy (staging)

# The real staging environment (2026-08-26): a second, genuinely separate
# Supabase project, Railway environment, Upstash database, and KMS master
# key — none shared with production. This is what deploy-staging.yml used
# to mean before it was renamed to deploy-production.yml; see that file's
# header for the full reasoning on why the split happened and how each
# workflow keeps the other's secrets out of reach (a GitHub Environment per
# target, a distinct tag suffix per target, an explicit `-e staging` on
# every Railway CLI call rather than relying on the CLI's default link).
#
# API-only, deliberately: apps/web has no second Vercel project yet (not
# asked for, and provisioning one silently here would risk a staging build
# landing on the SAME Vercel project that serves real traffic — worse than
# not having a staging web target at all). Everything below proves apps/api
# boots clean against the isolated Supabase project, RLS holds, and a real
# signup/org-creation round-trip works — same rigor as the production
# workflow's own checks, just without a browser-facing frontend to also
# deploy.
on:
  push:
    tags:
      - "v*.*.*-staging"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging stack
    runs-on: ubuntu-latest
    environment: railway-staging
    env:
      RAILWAY_SERVICE: "@byok/api"
      RAILWAY_ENV: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run migrations against managed Postgres (Supabase, staging project)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: npm run db:migrate

      # Same real negative test as production's workflow — see
      # packages/db/src/verifyRlsIsolation.ts and deploy-production.yml's
      # own comment on this step for what it does and doesn't prove.
      - name: Verify RLS isolation against live Supabase (real negative test)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: npm run db:verify-rls

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.30.3

      # Belt-and-suspenders alongside the explicit `-e "$RAILWAY_ENV"` on
      # every command below — see deploy-production.yml's identical step
      # for why this exists even though most commands also take -e.
      - name: Link Railway environment explicitly
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway environment "$RAILWAY_ENV"

      # No Vercel project for staging yet, so there is no web origin to
      # derive from an API call the way production's workflow does — the
      # Railway URL (generated below) stands in as its own origin. A
      # backend-only environment trusting requests that claim to come from
      # itself is a reasonable placeholder specifically because nothing
      # else can legitimately claim to be this origin yet; revisit if a
      # real staging frontend is ever added.
      - name: Configure Railway environment and deploy apps/api
        id: railway_deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          UPSTASH_REDIS_URL: ${{ secrets.REDIS_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTERNAL_METRICS_TOKEN: ${{ secrets.INTERNAL_METRICS_TOKEN }}
          STAGING_KMS_MASTER_KEY: ${{ secrets.STAGING_KMS_MASTER_KEY }}
        run: |
          if [ -z "$STAGING_KMS_MASTER_KEY" ]; then
            echo "::error::STAGING_KMS_MASTER_KEY secret is not set for the railway-staging environment. This must be a real, persisted environment secret (generate once with: node -e \"console.log(require('crypto').randomBytes(32).toString('base64'))\") — it is never regenerated by this workflow, because doing so permanently orphans every tenant's DEK. Refusing to deploy rather than silently booting with an empty/undefined KMS master key."
            exit 1
          fi
          if [ -z "$UPSTASH_REDIS_URL" ]; then
            echo "::error::REDIS_URL secret is not set for the railway-staging environment. Create a separate Upstash Redis database for staging (never share production's) and register its connection string as the REDIS_URL environment secret."
            exit 1
          fi

          BETTER_AUTH_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "::add-mask::$BETTER_AUTH_SECRET"

          railway variable set "DATABASE_URL=$SUPABASE_DATABASE_URL" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"
          railway variable set "REDIS_URL=$UPSTASH_REDIS_URL" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"
          railway variable set "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"
          railway variable set "STAGING_KMS_MASTER_KEY=$STAGING_KMS_MASTER_KEY" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"
          railway variable set "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"
          railway variable set "INTERNAL_METRICS_TOKEN=$INTERNAL_METRICS_TOKEN" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"
          railway variable set "CROSS_SITE_COOKIES=true" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"
          railway variable set "NODE_ENV=staging" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"
          railway variable set "NIXPACKS_NODE_VERSION=22" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"
          railway variable set "BUILD_SHA=${{ github.sha }}" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"

          # Same railwayapp/cli#696 log-streaming bug and --detach fix as
          # deploy-production.yml — see that file's comment for the full
          # history.
          for attempt in 1 2; do
            if railway up --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV" --detach; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::railway up --detach failed twice in a row (this is upload/API failure, not the log-streaming bug — --detach never opens that subscription)."
              exit 1
            fi
            echo "railway up --detach failed (attempt $attempt/2) — retrying..."
            sleep 5
          done

          echo "Deploy queued (--detach); giving the build time to land before continuing."
          sleep 60
          railway status || true

      - name: Generate Railway's public domain for apps/api
        id: railway_domain
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          OUTPUT=$(railway domain --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV" 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https?://[a-zA-Z0-9.-]+\.railway\.app' | head -1)
          if [ -z "$URL" ]; then
            LIST_OUTPUT=$(railway domain list --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV" 2>&1)
            echo "$LIST_OUTPUT"
            HOST=$(echo "$LIST_OUTPUT" | grep -oE '[a-zA-Z0-9.-]+\.up\.railway\.app' | head -1)
            if [ -n "$HOST" ]; then
              URL="https://$HOST"
            fi
          fi
          if [ -z "$URL" ]; then
            echo "::error::Could not determine Railway's public domain for apps/api from 'railway domain' output."
            exit 1
          fi
          echo "Railway URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # WEB_ORIGIN/BETTER_AUTH_URL both set to Railway's own domain here —
      # see the "no Vercel project for staging yet" note above the deploy
      # step. Needs Railway's domain, which only exists after the first
      # deploy, so this is a second variable-set + redeploy, same as
      # production's workflow.
      - name: Set WEB_ORIGIN/BETTER_AUTH_URL and redeploy apps/api
        id: redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          RAILWAY_URL="${{ steps.railway_domain.outputs.url }}"
          railway variable set "WEB_ORIGIN=$RAILWAY_URL" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"
          railway variable set "BETTER_AUTH_URL=$RAILWAY_URL" --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV"

          for attempt in 1 2; do
            if railway up --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV" --detach; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::railway up --detach failed twice in a row (upload/API failure, not the log-streaming bug)."
              exit 1
            fi
            echo "railway up --detach failed (attempt $attempt/2) — retrying..."
            sleep 5
          done

          echo "Deploy queued (--detach); giving the build time to land before the health check."
          sleep 60
          railway status || true

      - name: Wait for apps/api to become healthy
        env:
          RAILWAY_URL: ${{ steps.railway_domain.outputs.url }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$RAILWAY_URL/health" > /dev/null; then
              echo "apps/api is healthy at $RAILWAY_URL/health"
              exit 0
            fi
            echo "Waiting for apps/api to come up ($i/30)..."
            sleep 5
          done
          echo "::error::apps/api never became healthy at $RAILWAY_URL/health"
          exit 1

      # Same self-reported-build-identity check as production's workflow
      # (ADR-029) — see that file's comment for the three failed approaches
      # this replaced and why.
      - name: Verify the deployment actually succeeded and is what's serving traffic
        env:
          RAILWAY_URL: ${{ steps.railway_domain.outputs.url }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          node apps/api/scripts/verify-build-sha.mjs "$RAILWAY_URL/health" "${{ github.sha }}" 30 10000 || {
            echo "::error::Dumping Railway logs for diagnosis."
            railway logs --deployment --latest -n 200 --environment "$RAILWAY_ENV" 2>&1 || true
            exit 1
          }

      # Real signup + org creation, same as production's workflow — proves
      # auth and RLS-scoped writes work end to end against the isolated
      # staging database, not just that the process answers /health.
      - name: Verify signup actually works end to end
        env:
          RAILWAY_URL: ${{ steps.railway_domain.outputs.url }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          STAMP=$(date +%s)
          echo "$STAMP" > /tmp/deploy_verify_stamp.txt
          STATUS=$(curl -s -c /tmp/deploy_verify_cookies.txt -D /tmp/signup_headers.txt -o /tmp/signup_resp.json -w "%{http_code}" -X POST "$RAILWAY_URL/api/auth/sign-up/email" \
            -H "Content-Type: application/json" \
            -H "Origin: $RAILWAY_URL" \
            -d "{\"email\":\"deploy-verify-$STAMP@example.invalid\",\"password\":\"Str0ngTempPassw0rd!\",\"name\":\"deploy verify\"}")
          echo "Signup HTTP status: $STATUS"
          cat /tmp/signup_resp.json 2>/dev/null
          echo ""
          if [ "$STATUS" -ge 300 ]; then
            echo "::error::Signup failed with HTTP $STATUS — fetching Railway logs for diagnosis."
            sleep 8
            railway logs --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV" 2>&1 | tail -100 || true
            exit 1
          fi
          echo "Signup succeeded end to end."

      - name: Verify org creation actually works end to end
        env:
          RAILWAY_URL: ${{ steps.railway_domain.outputs.url }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          STAMP=$(cat /tmp/deploy_verify_stamp.txt)
          STATUS=$(curl -s -b /tmp/deploy_verify_cookies.txt -o /tmp/org_resp.json -w "%{http_code}" -X POST "$RAILWAY_URL/api/auth/organization/create" \
            -H "Content-Type: application/json" \
            -H "Origin: $RAILWAY_URL" \
            -d "{\"name\":\"Deploy verify $STAMP\",\"slug\":\"deploy-verify-$STAMP\"}")
          echo "Org create HTTP status: $STATUS"
          cat /tmp/org_resp.json 2>/dev/null
          echo ""
          if [ "$STATUS" -ge 300 ]; then
            echo "::error::Org creation failed with HTTP $STATUS — fetching Railway logs for diagnosis."
            sleep 8
            railway logs --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENV" 2>&1 | tail -100 || true
            exit 1
          fi
          echo "Org creation succeeded end to end."

      - name: Summary
        env:
          API_URL: ${{ steps.railway_domain.outputs.url }}
        run: |
          {
            echo "### Staging deploy complete"
            echo ""
            echo "- apps/api: $API_URL"
            echo "- No web frontend deployed (no second Vercel project provisioned)"
          } >> "$GITHUB_STEP_SUMMARY"
