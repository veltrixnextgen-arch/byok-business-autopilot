services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: byok
      POSTGRES_PASSWORD: byok_dev_password
      POSTGRES_DB: byok
    ports:
      - "5432:5432"
    volumes:
      - byok_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - byok_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  byok_postgres_data:
  byok_redis_data:
